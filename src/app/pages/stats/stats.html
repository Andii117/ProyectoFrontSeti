<div class="container mt-4">
  <h2 class="text-center mb-4">📊 Dashboard de análisis ADN</h2>

  <div class="text-center mb-4">
    <button routerLink="/" class="btn btn-primary me-2">⬅ Volver al detector</button>

    <button class="btn btn-primary" [routerLink]="['/history']">📜 Volver al historial</button>
  </div>

  <div class="row g-4">
    <div class="col-md-12">
      <div class="card p-3">
        <h5 class="text-center">🧬 Mutantes vs Humanos por día</h5>
        <canvas id="mutantChart"></canvas>
      </div>
    </div>

    <div class="col-md-6">
      <div class="card p-3">
        <h5 class="text-center">📉 Ratio de mutantes</h5>
        <canvas id="ratioChart"></canvas>
      </div>
    </div>

    <div class="col-md-6">
      <div class="card p-3">
        <h5 class="text-center">📈 Total análisis por día</h5>
        <canvas id="totalChart"></canvas>
      </div>
    </div>
  </div>
</div>
